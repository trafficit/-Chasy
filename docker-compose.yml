name: worklog

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: worklog
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-worklog}
      POSTGRES_DB: worklog
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U worklog"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://worklog:${POSTGRES_PASSWORD:-worklog}@db:5432/worklog
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      BASE_URL: ${BASE_URL:?set BASE_URL in .env}
      SESSION_DAYS: ${SESSION_DAYS:-30}
      MAGIC_LINK_TTL_MINUTES: ${MAGIC_LINK_TTL_MINUTES:-20}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-Chasy <no-reply@example.com>}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      DEV_ECHO_MAGIC_LINK: ${DEV_ECHO_MAGIC_LINK:-false}
      LICENSE_REQUIRED: ${LICENSE_REQUIRED:-false}
      ADMIN_USER: ${ADMIN_USER:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      TRIAL_DAYS: ${TRIAL_DAYS:-0}
      FREE_EMAIL_DOMAINS: ${FREE_EMAIL_DOMAINS:-}
      PROMO_CODES: ${PROMO_CODES:-}
      TOS_VERSION: ${TOS_VERSION:-2026-09-09}
    expose:
      - "8000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  db_data:
  caddy_data:
  caddy_config:
