<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Chasy — админ</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #fff; --ink: #1b1f24; --muted: #6b7280;
    --line: #e3e6ea; --accent: #1f6feb; --danger: #d1242f; --ok: #1a7f37;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117; --card: #161b22; --ink: #e6edf3; --muted: #8b949e;
      --line: #30363d; --accent: #4493f8; --danger: #f85149; --ok: #3fb950;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 16px;
  }
  .wrap { max-width: 920px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 12px; }
  h2 { font-size: 15px; margin: 20px 0 8px; }
  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 10px; padding: 14px; margin: 10px 0;
  }
  label { display: block; font-size: 12px; color: var(--muted); margin: 8px 0 2px; }
  input {
    font: inherit; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 7px; padding: 8px; width: 100%;
  }
  button {
    font: inherit; font-weight: 600; border: 1px solid var(--accent);
    background: var(--accent); color: #fff; border-radius: 7px;
    padding: 8px 12px; cursor: pointer;
  }
  button.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
  button.danger { background: transparent; color: var(--danger); border-color: var(--line); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: end; margin-top: 8px; }
  .row > div { flex: 1 1 140px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 7px 6px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 600; }
  td input { padding: 5px; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .muted { color: var(--muted); }
  .ok { color: var(--ok); }
  .err { color: var(--danger); }
  .scroll { overflow-x: auto; }
  #msg { margin: 8px 0; min-height: 18px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Chasy — админка лицензий</h1>
  <div id="msg" class="muted"></div>

  <section id="auth" class="card">
    <label>Админ-токен (переменная <code>ADMIN_TOKEN</code>)</label>
    <div class="row">
      <div style="flex:3"><input id="token" type="password" autocomplete="off" /></div>
      <div style="flex:0"><button id="token-save">Войти</button></div>
    </div>
  </section>

  <main id="panel" hidden>
    <div class="row" style="justify-content:space-between">
      <button id="reload" class="ghost">Обновить</button>
      <button id="logout" class="danger">Выйти</button>
    </div>

    <section class="card">
      <h2>Новый код</h2>
      <div class="row">
        <div><label>Компания</label><input id="n-company" type="text" /></div>
        <div><label>Действует до</label><input id="n-until" type="date" /></div>
        <div><label>Мест (пусто = ∞)</label><input id="n-seats" type="number" min="1" /></div>
        <div style="flex:2"><label>Заметка</label><input id="n-note" type="text" /></div>
        <div style="flex:0"><button id="create">Создать</button></div>
      </div>
    </section>

    <section class="card scroll">
      <h2>Коды</h2>
      <table>
        <thead>
          <tr>
            <th>Код</th><th>Компания</th><th>Действует до</th><th>Мест</th>
            <th>Актив.</th><th>Польз.</th><th></th>
          </tr>
        </thead>
        <tbody id="licenses"></tbody>
      </table>
    </section>

    <section class="card scroll">
      <h2>Пользователи</h2>
      <table>
        <thead>
          <tr><th>Email</th><th>Код</th><th>Компания</th><th>Создан</th><th></th></tr>
        </thead>
        <tbody id="users"></tbody>
      </table>
    </section>
  </main>
</div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
let TOKEN = "";
try { TOKEN = localStorage.getItem("chasy_admin_token") || ""; } catch (_) {}

function msg(text, cls) {
  const m = $("msg");
  m.textContent = text || "";
  m.className = cls || "muted";
}

async function api(path, opts = {}) {
  const r = await fetch(path, {
    ...opts,
    headers: { "X-Admin-Token": TOKEN, ...(opts.headers || {}) },
  });
  if (r.status === 401) {
    showAuth("Неверный токен");
    throw new Error("unauthorized");
  }
  if (r.status === 404) {
    showAuth("Админка отключена — задайте ADMIN_TOKEN в .env и перезапустите");
    throw new Error("disabled");
  }
  return r;
}

function showAuth(text) {
  $("panel").hidden = true;
  $("auth").hidden = false;
  if (text) msg(text, "err");
}

function fmt(d) { return d ? d : "—"; }

async function loadAll() {
  const [lic, usr] = await Promise.all([
    api("/api/admin/licenses").then((r) => r.json()),
    api("/api/admin/users").then((r) => r.json()),
  ]);
  renderLicenses(lic);
  renderUsers(usr);
  msg(`Кодов: ${lic.length} · пользователей: ${usr.length}`, "muted");
}

function renderLicenses(rows) {
  const tb = $("licenses");
  tb.innerHTML = "";
  for (const l of rows) {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td><code>${l.code}</code></td>
      <td><input data-f="company" value="${l.company || ""}" /></td>
      <td><input data-f="valid_until" type="date" value="${l.valid_until || ""}" /></td>
      <td style="max-width:70px"><input data-f="seats" type="number" min="1" value="${l.seats ?? ""}" /></td>
      <td><input data-f="active" type="checkbox" ${l.active ? "checked" : ""} /></td>
      <td>${l.users}</td>
      <td style="white-space:nowrap">
        <button class="ghost" data-act="save">Сохранить</button>
        <button class="danger" data-act="del">Удалить</button>
      </td>`;
    tr.querySelector('[data-act="save"]').onclick = () => saveLicense(l.id, tr);
    tr.querySelector('[data-act="del"]').onclick = () => delLicense(l.id, l.code);
    tb.append(tr);
  }
}

async function saveLicense(id, tr) {
  const get = (f) => tr.querySelector(`[data-f="${f}"]`);
  const seatsRaw = get("seats").value.trim();
  const untilRaw = get("valid_until").value;
  const body = {
    company: get("company").value,
    active: get("active").checked,
    clear_valid_until: untilRaw === "",
    valid_until: untilRaw || null,
    clear_seats: seatsRaw === "",
    seats: seatsRaw === "" ? null : Number(seatsRaw),
  };
  const r = await api(`/api/admin/licenses/${id}`, {
    method: "PATCH",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  if (r.ok) { msg("Сохранено", "ok"); loadAll(); }
  else msg("Ошибка сохранения", "err");
}

async function delLicense(id, code) {
  if (!confirm(`Удалить код ${code}? Пользователи будут отвязаны.`)) return;
  const r = await api(`/api/admin/licenses/${id}`, { method: "DELETE" });
  if (r.ok || r.status === 204) { msg("Удалено", "ok"); loadAll(); }
}

async function createLicense() {
  const seats = $("n-seats").value.trim();
  const body = {
    company: $("n-company").value.trim(),
    valid_until: $("n-until").value || null,
    seats: seats === "" ? null : Number(seats),
    note: $("n-note").value.trim(),
  };
  const r = await api("/api/admin/licenses", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  if (r.ok) {
    const l = await r.json();
    $("n-company").value = $("n-until").value = $("n-seats").value = $("n-note").value = "";
    msg(`Создан код: ${l.code}`, "ok");
    loadAll();
  } else msg("Не удалось создать", "err");
}

function renderUsers(rows) {
  const tb = $("users");
  tb.innerHTML = "";
  for (const u of rows) {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${u.email}</td>
      <td>${u.license_code ? `<code>${u.license_code}</code>` : "—"}</td>
      <td>${fmt(u.license_company)}</td>
      <td class="muted">${(u.created_at || "").slice(0, 10)}</td>
      <td>${u.license_code ? '<button class="danger" data-act="unbind">Отвязать</button>' : ""}</td>`;
    const btn = tr.querySelector('[data-act="unbind"]');
    if (btn) btn.onclick = () => unbind(u.id, u.email);
    tb.append(tr);
  }
}

async function unbind(id, email) {
  if (!confirm(`Отвязать код от ${email}?`)) return;
  const r = await api(`/api/admin/users/${id}/unbind`, { method: "POST" });
  if (r.ok || r.status === 204) { msg("Отвязано", "ok"); loadAll(); }
}

function enter() {
  $("auth").hidden = true;
  $("panel").hidden = false;
  loadAll().catch(() => {});
}

$("token-save").onclick = () => {
  TOKEN = $("token").value.trim();
  try { localStorage.setItem("chasy_admin_token", TOKEN); } catch (_) {}
  if (TOKEN) enter();
};
$("logout").onclick = () => {
  TOKEN = "";
  try { localStorage.removeItem("chasy_admin_token"); } catch (_) {}
  showAuth("");
  msg("");
};
$("reload").onclick = () => loadAll().catch(() => {});
$("create").onclick = createLicense;

if (TOKEN) { $("token").value = TOKEN; enter(); } else showAuth("");
</script>
</body>
</html>
