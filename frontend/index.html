<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#1f6feb" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="/icon-192.png" />
<link rel="apple-touch-icon" href="/icon-192.png" />
<link rel="stylesheet" href="/style.css" />
<title>Chasy</title>
</head>
<body>

<div id="toast" class="toast" hidden></div>

<header id="topbar">
  <span class="brand">Chasy</span>
  <span class="spacer"></span>
  <span id="who" class="muted" hidden></span>
  <button id="logout" class="link" hidden data-i18n="logout">выйти</button>
  <select id="lang" aria-label="Language">
    <option value="ru">RU</option>
    <option value="uk">UKR</option>
    <option value="sk">SK</option>
    <option value="en">EN</option>
  </select>
</header>

<!-- ---------- login ---------- -->
<section id="login" class="card" hidden>
  <p class="muted" data-i18n="login_hint">Введите рабочую почту — пришлём ссылку для входа.</p>
  <form id="login-form">
    <input id="login-email" type="email" inputmode="email" autocomplete="email"
           placeholder="you@company.com" required />
    <button type="submit" data-i18n="login_btn">Получить ссылку</button>
  </form>
  <p id="login-sent" class="ok" hidden data-i18n="login_sent">
    Письмо отправлено. Откройте ссылку из письма на этом устройстве.
  </p>
</section>

<!-- ---------- app ---------- -->
<main id="app" hidden>
  <section class="card">
    <div class="grid">
      <label><span data-i18n="f_date">Дата</span>
        <input id="f-date" type="date" />
      </label>
      <label><span data-i18n="f_start">Начало</span>
        <input id="f-start" type="time" />
      </label>
      <label><span data-i18n="f_end">Конец</span>
        <input id="f-end" type="time" />
      </label>
      <label><span data-i18n="f_lunch">Обед (мин или Ч:ММ)</span>
        <input id="f-lunch" type="text" inputmode="numeric" placeholder="30" />
      </label>
      <label class="wide"><span data-i18n="f_comment">Комментарий</span>
        <input id="f-comment" type="text" placeholder="заметка" data-i18n-ph="ph_comment" />
      </label>
    </div>
    <div class="row">
      <button id="add" data-i18n="add">Добавить</button>
      <button id="holiday" class="ghost" data-i18n="holiday">Выходной</button>
      <button id="save-edit" class="ghost" hidden data-i18n="save_edit">Сохранить изменения</button>
      <button id="cancel-edit" class="link" hidden data-i18n="cancel">отмена</button>
    </div>
  </section>

  <section class="card">
    <ul id="list" class="list"></ul>
    <p id="empty" class="muted" hidden data-i18n="empty">Пока нет записей.</p>
    <div class="total" id="total"></div>
    <div class="row">
      <button id="up" class="ghost" disabled data-i18n="move_up">⬆ Выше</button>
      <button id="down" class="ghost" disabled data-i18n="move_down">⬇ Ниже</button>
      <button id="edit" class="ghost" disabled data-i18n="edit">✏️ Изменить</button>
      <button id="del" class="ghost danger" disabled data-i18n="del">🗑 Удалить</button>
    </div>
    <div class="row">
      <button id="export" data-i18n="export">Экспорт в Excel</button>
      <button id="import-btn" class="ghost" data-i18n="import">Импорт из Excel</button>
      <input id="import-file" type="file" accept=".xlsx" hidden />
    </div>
  </section>
</main>

<script src="/app.js"></script>
</body>
</html>
