<style>
  :root {
    --bg: #f4f5f7; --card: #fff; --ink: #1b1f24; --muted: #6b7280;
    --line: #e3e6ea; --accent: #1f6feb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117; --card: #161b22; --ink: #e6edf3; --muted: #8b949e;
      --line: #30363d; --accent: #4493f8;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 24px 16px 60px;
  }
  main { max-width: 680px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  h2 { font-size: 16px; margin: 22px 0 6px; }
  p, li { margin: 6px 0; }
  ul { padding-left: 22px; }
  a { color: var(--accent); }
  .muted { color: var(--muted); font-size: 13px; }
  .langbar { margin: 10px 0 4px; }
  .langbar button {
    font: inherit; background: none; border: 1px solid var(--line);
    color: var(--ink); border-radius: 7px; padding: 4px 10px; margin-right: 4px;
    cursor: pointer;
  }
  .langbar button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  hr { border: none; border-top: 1px solid var(--line); margin: 24px 0; }
</style>
</head>

  <div class="langbar">

function pickLang() {
  try {
    const s = localStorage.getItem("chasy_lang");
    if (s && T[s]) return s;
  } catch (_) {}
  const c = (navigator.language || "ru").slice(0, 2).toLowerCase();
  return T[c] ? c : "ru";
}

function render(lang) {
  const d = T[lang] || T.ru;
  document.documentElement.lang = lang;
  document.getElementById("t-title").textContent = d.title;
  document.getElementById("t-version").textContent = d.version;
  document.getElementById("t-contact").innerHTML = d.contact;
  const body = document.getElementById("t-body");
  body.innerHTML = "";
  for (const [h, items] of d.sections) {
    const el = document.createElement("h2");
    el.textContent = h;
    body.append(el);
    if (items.length === 1) {
      const p = document.createElement("p");
      p.textContent = items[0];
      body.append(p);
    } else {
      const ul = document.createElement("ul");
      for (const it of items) {
        const li = document.createElement("li");
        li.textContent = it;
        ul.append(li);
      }
      body.append(ul);
    }
  }
  document.querySelectorAll(".langbar button").forEach((b) => {
    b.setAttribute("aria-pressed", String(b.dataset.lang === lang));
  });
}

document.querySelectorAll(".langbar button").forEach((b) => {
  b.addEventListener("click", () => {
    try { localStorage.setItem("chasy_lang", b.dataset.lang); } catch (_) {}
    render(b.dataset.lang);
  });
});

render(pickLang());

</html>
